<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00965e" />
    <meta name="description" content="Finn offentlige tilfluktsrom i Norge" />
    <title>Bomberom</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-512.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <header class="chrome">
      <div class="chrome-row">
        <div class="titles">
          <h1>Bomberom</h1>
          <p class="lead" id="status">…</p>
        </div>
        <button type="button" class="icon-btn" id="favBtn" aria-label="Favoritter">♡</button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Innstillinger">⚙</button>
      </div>
      <div class="search-row">
        <input
          id="q"
          type="search"
          placeholder="Søk sted, adresse eller romnummer…"
          autocomplete="off"
          enterkeyhint="search"
        />
        <button type="button" class="seg" id="viewMap" data-view="map">Kart</button>
        <button type="button" class="seg" id="viewList" data-view="list">Liste</button>
      </div>
      <div id="geoChoices" class="geo-choices" hidden></div>
    </header>

    <main>
      <section id="map" class="map" aria-label="Kart"></section>
      <section id="listWrap" class="list-wrap" hidden>
        <section id="list" class="list" aria-live="polite"></section>
      </section>
      <button type="button" class="gps" id="gpsBtn">Finn nærmeste med GPS</button>
    </main>

    <aside id="sheet" class="sheet" hidden>
      <div class="sheet-handle" id="sheetClose" role="button" tabindex="0">Lukk</div>
      <div id="sheetBody"></div>
    </aside>

    <aside id="modal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modalTitle">Innstillinger</h2>
          <button type="button" class="icon-btn" id="modalClose" aria-label="Lukk">✕</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </aside>

    <footer class="footer">
      <details>
        <summary id="disclaimerTitle">Viktig informasjon</summary>
        <p id="disclaimerBody"></p>
        <p class="meta" id="dataMeta"></p>
      </details>
    </footer>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="./app.js?v=2" type="module"></script>
  </body>
</html>
